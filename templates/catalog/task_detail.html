{% extends "catalog/base.html" %}

{% block content %}
<div class="card shadow-sm p-4 mb-4">
  <h1>{{ task.name }}</h1>
  <p class="text-muted">{{ task.description }}</p>
  <p><strong>Status:</strong> <span class="badge badge-secondary">{{ task.status }}</span></p>
  <p><strong>Project:</strong> {{ task.project.name }}</p>
  <p><strong>Assignee:</strong> {{ task.assignee }}</p>

  <div class="mt-3">
    <a href="{% url 'catalog:task-update' task.pk %}" class="btn btn-outline-dark btn-sm">Edit</a>
    <a href="{% url 'catalog:task-delete' task.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
    <a href="{% url 'catalog:tasks' %}" class="btn btn-secondary btn-sm">Back to List</a>
  </div>
</div>
{% endblock %}
