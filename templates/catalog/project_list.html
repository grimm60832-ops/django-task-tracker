{% extends "catalog/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Projects</h1>
  <a href="{% url 'catalog:project-create' %}" class="btn btn-dark">Create Project</a>
</div>

<ul class="list-group">
  {% for project in project_list %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <a href="{% url 'catalog:project-detail' project.pk %}">{{ project.name }}</a>
      <div>
        <a href="{% url 'catalog:project-update' project.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <a href="{% url 'catalog:project-delete' project.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
      </div>
    </li>
  {% empty %}
    <p class="text-muted">No projects found.</p>
  {% endfor %}
</ul>
{% endblock %}
