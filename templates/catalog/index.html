{% extends "catalog/base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="jumbotron text-center mb-4" style="background-color: rgba(220, 224, 230, 0.75); backdrop-filter: blur(5px);">
    <h1 class="display-4">Welcome to Task Tracker!</h1>
    <p class="lead" style="font-size: 1.6rem;">Manage your projects, tasks, and team efficiently.</p>
  </div>

  <h3 class="text-center mb-5 text-dark font-weight-normal" style="margin-top: 30px;">System Statistics</h3>

  <div class="row justify-content-center">

    <!-- Projects -->
    <div class="col-auto mb-3">
      <a href="{% url 'catalog:projects' %}" class="text-decoration-none">
        <div class="rounded-circle bg-primary text-white d-flex flex-column align-items-center justify-content-center shadow"
             style="width: 230px; height: 230px;">
          <span class="text-white mb-1" style="font-size: 1.6rem; font-weight: 400;">Projects</span>
          <span class="text-white" style="font-size: 1.8rem; font-weight: 400;">{{ num_projects }}</span>
        </div>
      </a>
    </div>

    <!-- Tasks -->
    <div class="col-auto mb-3">
      <a href="{% url 'catalog:tasks' %}" class="text-decoration-none">
        <div class="rounded-circle bg-success text-white d-flex flex-column align-items-center justify-content-center shadow"
             style="width: 230px; height: 230px;">
          <span class="text-white mb-1" style="font-size: 1.6rem; font-weight: 400;">Tasks</span>
          <span class="text-white" style="font-size: 1.8rem; font-weight: 400;">{{ num_tasks }}</span>
        </div>
      </a>
    </div>

    <!-- Developers -->
    <div class="col-auto mb-3">
      <a href="{% url 'catalog:developers' %}" class="text-decoration-none">
        <div class="rounded-circle bg-info text-white d-flex flex-column align-items-center justify-content-center shadow"
             style="width: 230px; height: 230px;">
          <span class="text-white mb-1" style="font-size: 1.6rem; font-weight: 400;">Developers</span>
          <span class="text-white" style="font-size: 1.8rem; font-weight: 400;">{{ num_developers }}</span>
        </div>
      </a>
    </div>

    <!-- Positions -->
    <div class="col-auto mb-3">
      <a href="{% url 'catalog:positions' %}" class="text-decoration-none">
        <div class="rounded-circle bg-secondary text-white d-flex flex-column align-items-center justify-content-center shadow"
             style="width: 230px; height: 230px;">
          <span class="text-white mb-1" style="font-size: 1.6rem; font-weight: 400;">Positions</span>
          <span class="text-white" style="font-size: 1.8rem; font-weight: 400;">{{ num_positions }}</span>
        </div>
      </a>
    </div>

  </div>
</div>
{% endblock %}
