<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Task Tracker{% endblock %}</title>
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'catalog:index' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'catalog:projects' %}">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'catalog:tasks' %}">Tasks</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'catalog:developers' %}">Developers</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'catalog:positions' %}">Positions</a></li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'catalog:dev_profile' %}">
            <i class="bi bi-person-circle"></i> Profile
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Messages -->
  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
          {{ message }}
          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      {% endfor %}
    {% endif %}
  </div>

  <div class="container">
    {% block content %}
    {% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
