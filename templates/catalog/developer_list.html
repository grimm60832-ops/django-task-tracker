{% extends "catalog/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Developers</h1>
  <a href="{% url 'catalog:developer-create' %}" class="btn btn-dark">Add Developer</a>
</div>

<ul class="list-group">
  {% for developer in developer_list %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <a href="{% url 'catalog:developer-detail' developer.pk %}">
        {{ developer.first_name }} {{ developer.last_name }} ({{ developer.username }})
      </a>
      <div>
        <a href="{% url 'catalog:developer-update' developer.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <a href="{% url 'catalog:developer-delete' developer.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
      </div>
    </li>
  {% empty %}
    <p class="text-muted">No developers found.</p>
  {% endfor %}
</ul>
{% endblock %}
