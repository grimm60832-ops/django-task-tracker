{% extends "catalog/base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4 text-center">
      <h2>Remove Developer</h2>
      <p class="mt-3">Are you sure you want to remove <strong>"{{ developer.username }}"</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-block">Confirm Delete</button>
        <a href="{% url 'catalog:developers' %}" class="btn btn-secondary btn-block mt-2">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
