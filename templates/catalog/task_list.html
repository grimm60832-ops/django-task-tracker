{% extends "catalog/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Tasks</h1>
  <a href="{% url 'catalog:task-create' %}" class="btn btn-dark">Create Task</a>
</div>

<ul class="list-group">
  {% for task in task_list %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <a href="{% url 'catalog:task-detail' task.pk %}">{{ task.name }}</a>
        <span class="badge badge-secondary ml-2">{{ task.status }}</span>
      </div>
      <div>
        <a href="{% url 'catalog:task-update' task.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <a href="{% url 'catalog:task-delete' task.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
      </div>
    </li>
  {% empty %}
    <p class="text-muted">No tasks found.</p>
  {% endfor %}
</ul>
{% endblock %}
