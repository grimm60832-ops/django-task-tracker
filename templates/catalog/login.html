{% extends "catalog/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-lg rounded-lg">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <p class="text-muted small">Please sign in to your account</p>
        </div>

        {% if form.errors %}
          <div class="alert alert-danger border-0 small py-2 mb-3 text-center">
            Invalid username or password.
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="form-group mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label text-muted small font-weight-bold">USERNAME</label>
            <input type="text"
                   name="{{ form.username.name }}"
                   id="{{ form.username.id_for_label }}"
                   class="form-control form-control-lg bg-light border-0"
                   placeholder="Enter username"
                   required>
          </div>

          <div class="form-group mb-4">
            <label for="{{ form.password.id_for_label }}" class="form-label text-muted small font-weight-bold">PASSWORD</label>
            <input type="password"
                   name="{{ form.password.name }}"
                   id="{{ form.password.id_for_label }}"
                   class="form-control form-control-lg bg-light border-0"
                   placeholder="Enter password"
                   required>
          </div>

          <button type="submit" class="btn btn-dark btn-lg btn-block w-100 py-2">Sign In</button>
        </form>

        <div class="text-center mt-3">
          <p class="text-muted small mb-2">Don't have an account?</p>
          <a href="{% url 'catalog:register' %}" class="btn btn-dark btn-lg btn-block w-100 py-2">Sign Up</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
